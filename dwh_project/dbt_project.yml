name: 'dwh_project'
version: '1.0.0'
config-version: 2

# Trỏ tới profile trong profiles.yml (đặt cùng thư mục này, xem README)
profile: 'dwh_project'

# Vị trí các loại file
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ─────────────────────────────────────────────────────────────
# NGUỒN LINH HOẠT: database/schema nguồn raw lấy từ env (SRC_DB, SRC_SCHEMA)
# — khai báo trực tiếp trong models/staging/_sources.yml (env_var + var fallback).
# Đổi khi chạy: --vars '{raw_schema: xxx}' hoặc set env SRC_*.
# (KHÔNG đặt Jinja trong vars: ở đây — dbt không render lồng, var() sẽ trả literal.)
# ─────────────────────────────────────────────────────────────

seeds:
  dwh_project:
    videos_id_agency:
      +column_types:
        video_id: varchar
    pic_user_map:
      # Ép varchar: user_id là ĐỊNH DANH, không phải số để tính toán. Nếu để dbt tự suy
      # kiểu, cột đang trống sẽ thành integer (hoặc bool) rồi vỡ khi điền id thật.
      # Cùng lý do với video_id/creator_id đang là text ở tầng staging.
      +column_types:
        pic_trong_send_sample: varchar
        user_id: varchar

# ─────────────────────────────────────────────────────────────
# ĐÍCH: schema output cho từng tầng model.
# staging = view (nhẹ), marts = table (vật lý hóa kết quả cuối)
# ─────────────────────────────────────────────────────────────
models:
  dwh_project:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
