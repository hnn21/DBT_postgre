version: 2

models:
  - name: mart_data
    description: >
      Bảng rộng tái tạo bảng `data` của MVA_VideoAFF.pbix: cột gốc performance_list
      + các cột tính toán (prod_contain, prod_contain_combo, Loại video, Ngày gửi mẫu,
      duration_date, range_date, video_duoctinhPFM, DK Creator được gửi mẫu,
      DK Time air video, Phân loại Creator, Group creator, PIC, pic_user_id,
      Vị trí, Mẫu gửi, campaign_id, koc_booking_content_id).
      Khoá join với bảng gửi mẫu là `creator_id` (KHÔNG phải creator_name) — xem
      map_creator/map_creator_resolve. Cột `Team` ĐÃ BỎ: lấy từ dim_pic qua pic_user_id.
    columns:
      - name: video_id
        description: "Khóa video."
      - name: duration_date
        description: >
          DẤU thỏa/không (TĨNH, không phụ thuộc run_date): 1 = có mẫu và time >= Ngày gửi mẫu
          (video lên sau khi gửi mẫu); -1 = không có mẫu hoặc time < Ngày gửi mẫu.
      - name: range_date
        description: >
          Tính cho MỌI dòng: tuổi video tại thời điểm snapshot = số ngày (date_file_excel - time),
          bucket 7/14/30/60/90/180; 999 = >180 ngày; NULL nếu time NULL.
      - name: campaign_id
        description: >
          Mã campaign của lần gửi mẫu mà video này rơi vào (cùng bản ghi đã cho
          Vị trí/Mẫu gửi/nguon_yeu_cau). NULL nếu video không khớp lần gửi mẫu nào
          hoặc lần gửi mẫu đó không thuộc campaign. Kiểu text.
      - name: pic_user_id
        description: >
          Danh tính PIC (users.id của hệ thống krm). Lấy từ stg_send_sample:
          coalesce(user_id ở nguồn, tra seed pic_user_map theo tên PIC). Join với
          dim_pic để lấy username/team.
      - name: koc_booking_content_id
        description: >
          FK tới koc_booking_contents.id. Pick theo ĐÚNG luật của campaign_id
          (cụm vm_pick). NULL nếu bản ghi gửi mẫu khớp không có giá trị này —
          nguồn mới phủ ~4,1% nên phần lớn dòng là NULL.

  - name: mart_data_agg
    description: >
      Metric hiệu suất từ mart_data theo tổ hợp các chiều (thang, tuan, time, brand,
      creator_id, pic_user_id, duration_date, range_date, prod_contain, prod_contain_combo,
      Ngày gửi mẫu, Phân loại Creator, Group creator, Vị trí, Mẫu gửi, campaign_id,
      koc_booking_content_id) + video_id.
      GRAIN = các chiều + video_id, tức 1 dòng = 1 video trong 1 tổ hợp chiều.
      CHỞ ID, KHÔNG CHỞ NHÃN: creator_name lấy từ dim_creator, username/team lấy từ
      dim_pic — join trong Power BI. Bảng fact không còn creator_name/PIC/Team.
      SỐ VIDEO phải đếm bằng count(distinct video_id) / DISTINCTCOUNT(video_id) — KHÔNG
      cộng số dòng; nhờ giữ video_id, số video đúng ở mọi mức roll-up (tuần/tháng/quý).
      KHÔNG lọc duration_date — nó là một chiều trong grain, phía báo cáo tự lọc nếu cần.
      Metric là số phát sinh theo từng snapshot (không lũy kế) nên được SUM trên toàn bộ
      dòng gốc.
    columns:
      - name: video_id
        description: "Khóa video — nằm TRONG grain. Đếm số video bằng distinct trên cột này."
      - name: so_view
        description: "sum(vv) — lượt xem."
      - name: so_click
        description: "sum(click_on_the_product) — lượt click vào sản phẩm."
      - name: so_don
        description: "sum(count_order) — số đơn."
      - name: gmv
        description: "sum(video_revenue) — GMV (lấy từ video_revenue, KHÔNG dùng cột gmv của nguồn)."
      - name: product_impressions
        description: "sum(product_impressions) — lượt hiển thị sản phẩm."
      - name: unit_sales
        description: "sum(unit_sales) — số sản phẩm bán được."
      - name: thang
        description: "to_char(date_file_excel,'YYYY-MM') — tháng của NGÀY FILE SNAPSHOT."
      - name: tuan
        description: >
          to_char(date_file_excel,'IYYY-IW') — tuần ISO của NGÀY FILE SNAPSHOT.
          Dùng IYYY (không phải YYYY) vì cuối tháng 12 có thể thuộc tuần 1 năm sau.

unit_tests:
  # ── Nhóm 0: grain 15 chiều + video_id của mart_data_agg ─────────
  - name: ut_agg_grain_dims_video
    description: >
      Cùng video qua 2 snapshot với các chiều y hệt -> gộp còn 1 dòng.
      Khác creator_name -> tách dòng riêng. Khác duration_date -> tách dòng riêng.
      Dòng duration_date <= 0 VẪN được giữ (duration_date là chiều, không phải bộ lọc).
    model: mart_data_agg
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_data')
        rows:
          # v1 xuất hiện 2 snapshot, 13 chiều y hệt -> gộp còn 1
          - {video_id: "v1", time: "2025-03-10", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web"}
          - {video_id: "v1", time: "2025-03-10", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web"}
          # v2 giống mọi chiều nhưng KHÁC creator_name -> dòng riêng
          - {video_id: "v2", time: "2025-03-10", brand: "DHC", creator_id: "b", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web"}
          # v4 cùng creator "a" nhưng KHÁC duration_date -> dòng riêng
          - {video_id: "v4", time: "2025-03-10", brand: "DHC", creator_id: "a", duration_date: 3, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web"}
          # v3 duration_date <= 0 -> vẫn có mặt, nằm ở nhóm duration_date = -1
          - {video_id: "v3", time: "2025-03-10", brand: "DHC", creator_id: "c", duration_date: -1, range_date: null, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": null, "Phân loại Creator": "Organic", "Group creator": "Organic", pic_user_id: null, "Vị trí": null, "Mẫu gửi": null, nguon_yeu_cau: null}
    expect:
      rows:
        - {video_id: "v1", creator_id: "a", duration_date: 7}
        - {video_id: "v2", creator_id: "b", duration_date: 7}
        - {video_id: "v4", creator_id: "a", duration_date: 3}
        - {video_id: "v3", creator_id: "c", duration_date: -1}

  # ── Nhóm 0b: metric cộng trên MỌI dòng snapshot ─────────────────
  - name: ut_agg_metrics_sum_snapshots
    description: >
      Cái bẫy chính: metric phải SUM trên dòng gốc, KHÔNG sum trên tập đã khử trùng
      theo video_id. v1 có 2 snapshot cùng tổ hợp chiều -> gộp còn 1 dòng nhưng
      6 metric cộng cả 2 dòng. Metric null -> 0 (không trả null).
    model: mart_data_agg
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_data')
        rows:
          - {video_id: "v1", time: "2025-03-10", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web", vv: 100, click_on_the_product: 10, count_order: 2, video_revenue: 500000, product_impressions: 40, unit_sales: 3}
          - {video_id: "v1", time: "2025-03-10", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web", vv: 250, click_on_the_product: 5, count_order: 1, video_revenue: 300000, product_impressions: 60, unit_sales: 1}
          # v2 cùng tổ hợp, metric null -> phải ra 0 chứ không null
          - {video_id: "v2", time: "2025-03-11", brand: "DHC", creator_id: "b", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web", vv: null, click_on_the_product: null, count_order: null, video_revenue: null, product_impressions: null, unit_sales: null}
    expect:
      rows:
        - {video_id: "v1", creator_id: "a", so_view: 350, so_click: 15, so_don: 3, gmv: 800000, product_impressions: 100, unit_sales: 4}
        - {video_id: "v2", creator_id: "b", so_view: 0, so_click: 0, so_don: 0, gmv: 0, product_impressions: 0, unit_sales: 0}

  # ── Nhóm 0c: thang / tuan từ date_file_excel ───────────────────
  - name: ut_agg_thang_tuan
    description: >
      Cùng 1 video qua 3 snapshot khác kỳ -> tách 3 dòng (cùng video_id), metric
      tách theo kỳ. Ca giao năm: 2025-12-29 thuộc tuần ISO 01 của 2026
      -> tuan = '2026-01' trong khi thang = '2025-12' (chốt IYYY, không phải YYYY).
    model: mart_data_agg
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('mart_data')
        rows:
          - {video_id: "v1", date_file_excel: "2025-03-10", time: "2025-03-01", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-02-25", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web", vv: 100, click_on_the_product: 1, count_order: 1, video_revenue: 1000, product_impressions: 10, unit_sales: 1}
          - {video_id: "v1", date_file_excel: "2025-04-15", time: "2025-03-01", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-02-25", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web", vv: 200, click_on_the_product: 2, count_order: 2, video_revenue: 2000, product_impressions: 20, unit_sales: 2}
          - {video_id: "v1", date_file_excel: "2025-12-29", time: "2025-03-01", brand: "DHC", creator_id: "a", duration_date: 7, range_date: 30, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-02-25", "Phân loại Creator": "S", "Group creator": "S", pic_user_id: 1, "Vị trí": "top", "Mẫu gửi": "m1", nguon_yeu_cau: "web", vv: 300, click_on_the_product: 3, count_order: 3, video_revenue: 3000, product_impressions: 30, unit_sales: 3}
    expect:
      rows:
        - {video_id: "v1", thang: "2025-03", tuan: "2025-11", so_view: 100, so_don: 1, gmv: 1000}
        - {video_id: "v1", thang: "2025-04", tuan: "2025-16", so_view: 200, so_don: 2, gmv: 2000}
        - {video_id: "v1", thang: "2025-12", tuan: "2026-01", so_view: 300, so_don: 3, gmv: 3000}

  # ── Nhóm 1: sản phẩm & loại video ──────────────────────────────
  - name: ut_mart_prod_and_loaivideo
    model: mart_data
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-01", product_name: "DHC combo b mix", creator_name: "a", creator_id: "a"}
          - {video_id: "v2", time: "2025-03-01", product_name: "Togishi kem chống nắng", creator_name: "b", creator_id: "b"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "b mix", product_contain_combo: "combo b mix + c"}
      - input: ref('int_send_sample')
        rows: []
      - input: ref('int_valid_classification')
        rows: []
      - input: ref('videos_id_agency')
        rows:
          - {video_id: "v2"}
    expect:
      rows:
        - {video_id: "v1", prod_contain: "b mix", prod_contain_combo: "combo b mix + c", "Loại video": "Video thường"}
        - {video_id: "v2", prod_contain: "Kem chống nắng", prod_contain_combo: "Kem chống nắng", "Loại video": "Video AI"}

  # ── Nhóm 2: gửi mẫu & thời gian (duration_date = DẤU tĩnh; range_date theo snapshot) ───
  - name: ut_mart_duration
    model: mart_data
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", date_file_excel: "2025-03-12", product_name: "x", creator_name: "a", creator_id: "a"}
          # v2: KHÔNG thỏa (creator "z" không có mẫu) nhưng range_date VẪN được tính
          - {video_id: "v2", time: "2025-03-01", date_file_excel: "2025-03-20", product_name: "y", creator_name: "z", creator_id: "z"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
          - {video_id: "v2", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", creator_id: "a", pic_user_id: 1, prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "An", vi_tri: "top", product_detail: "kẽm", phan_loai_creator_fix: "S"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        # v1: time (2025-03-10) >= Ngày gửi mẫu (2025-03-05) -> duration_date = 1 (thỏa).
        #     range_date = date_file_excel (2025-03-12) - time (2025-03-10) = 2 ngày -> 7.
        - {video_id: "v1", "Ngày gửi mẫu": "2025-03-05", duration_date: 1, range_date: 7, "video_duoctinhPFM": 1, "DK Creator được gửi mẫu": "Có gửi mẫu", "DK Time air video": "Thỏa mãn ĐK thời gian là sau khi gửi mẫu"}
        # v2: không mẫu -> duration_date = -1, NHƯNG range_date vẫn tính:
        #     date_file_excel (2025-03-20) - time (2025-03-01) = 19 ngày -> 30.
        - {video_id: "v2", "Ngày gửi mẫu": null, duration_date: -1, range_date: 30, "video_duoctinhPFM": 0, "DK Creator được gửi mẫu": "Ko gửi mẫu", "DK Time air video": "Không tính"}

  # ── Nhóm 3: phân loại creator ──────────────────────────────────
  - name: ut_mart_phanloai
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "a", creator_id: "a"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", creator_id: "a", pic_user_id: 1, prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "An", vi_tri: "top", product_detail: "kẽm", phan_loai_creator_fix: "S"}
          - {koc_kol: "a", creator_id: "a", pic_user_id: 1, prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-06", ngay_ket_thuc: "2099-12-31", pic_rename: "An", vi_tri: "top", product_detail: "kẽm", phan_loai_creator_fix: "L1"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      # priority S=3 < L1=6 -> chọn S; S ∈ whitelist; PFM=1 -> "S"; group không chứa L* -> "S"
      rows:
        - {video_id: "v1", "Phân loại Creator": "S", "Group creator": "S"}

  # ── Nhóm 4: PIC / Team / Vị trí / Mẫu gửi ──────────────────────
  - name: ut_mart_pic_team_vitri_maugui
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "a", creator_id: "a"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", creator_id: "a", pic_user_id: 1, prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "Anh", vi_tri: "top", product_detail: "mẫu A", phan_loai_creator_fix: "S"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        - {video_id: "v1", "PIC": "Anh", "Vị trí": "top", "Mẫu gửi": "mẫu A"}

  # ── Nhóm 5: creator ĐỔI TÊN vẫn khớp được mẫu gửi ──────────────
  # Video mang tên MỚI ('ten_moi'), bản ghi gửi mẫu lưu tên CŨ ('ten_cu'),
  # nhưng cùng creator_id -> phải khớp. Trên code cũ (join theo TÊN) test này FAIL:
  # mọi cột pick = null, duration_date = -1, Phân loại Creator = 'Organic'.
  # Đây là lỗi đang ảnh hưởng ~8.430 video (3,9%).
  - name: ut_mart_creator_doi_ten
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "ten_moi", creator_id: "C1"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "ten_cu", creator_id: "C1", pic_user_id: 1, prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "Anh", vi_tri: "top", product_detail: "mẫu A", phan_loai_creator_fix: "S"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        - {video_id: "v1", "Ngày gửi mẫu": "2025-03-05", "PIC": "Anh", "Vị trí": "top", "Mẫu gửi": "mẫu A", "Phân loại Creator": "S"}

  # ── Nhóm 6: campaign_id theo cụm vm_pick ───────────────────────
  - name: ut_mart_campaign_id
    description: >
      campaign_id lấy từ CÙNG bản ghi gửi mẫu đã cho Vị trí/Mẫu gửi (cụm vm_pick).
      v1 lên sóng SAU ngày duyệt mẫu -> rơi vào khoảng hiệu lực -> nhận campaign '5'.
      v2 lên sóng TRƯỚC ngày duyệt mẫu -> không khớp -> campaign_id = NULL.
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "a", creator_id: "a"}
          - {video_id: "v2", time: "2025-03-01", product_name: "x", creator_name: "a", creator_id: "a"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
          - {video_id: "v2", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", creator_id: "a", pic_user_id: 1, prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "Anh", vi_tri: "top", product_detail: "mẫu A", phan_loai_creator_fix: "S", campaign_id: "5"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        - {video_id: "v1", campaign_id: "5", "Mẫu gửi": "mẫu A"}
        - {video_id: "v2", campaign_id: null, "Mẫu gửi": null}
