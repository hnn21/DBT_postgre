version: 2

models:
  - name: mart_data
    description: >
      Bảng rộng tái tạo bảng `data` của MVA_VideoAFF.pbix: cột gốc performance_list
      + 14 cột tính toán (prod_contain, prod_contain_combo, Loại video, Ngày gửi mẫu,
      duration_date, video_duoctinhPFM, DK Creator được gửi mẫu, DK Time air video,
      Phân loại Creator, Group creator, PIC, Team, Vị trí, Mẫu gửi).
    columns:
      - name: video_id
        description: "Khóa video."

  - name: mart_data_agg
    description: >
      Tổng hợp số video (distinct) từ mart_data theo tổ hợp 13 chiều
      (time, brand, creator_name, duration_date, prod_contain, prod_contain_combo,
      Ngày gửi mẫu, Phân loại Creator, Group creator, PIC, Team, Vị trí, Mẫu gửi),
      chỉ lấy duration_date > 0.
    columns:
      - name: so_luong_video
        description: "count(distinct video_id) trong mỗi tổ hợp."

unit_tests:
  # ── Nhóm 0: grain 13 chiều của mart_data_agg ────────────────────
  - name: ut_agg_grain_13_dims
    description: >
      Cùng video qua 2 snapshot với 13 chiều y hệt -> chỉ đếm 1 (count distinct video_id).
      Khác creator_name -> tách dòng riêng. Khác duration_date -> tách dòng riêng.
      Dòng duration_date <= 0 bị loại khỏi bảng.
    model: mart_data_agg
    given:
      - input: ref('mart_data')
        rows:
          # v1 xuất hiện 2 snapshot, 13 chiều y hệt -> gộp còn 1
          - {video_id: "v1", time: "2025-03-10", brand: "DHC", creator_name: "a", duration_date: 7, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", "PIC": "An", "Team": "T1", "Vị trí": "top", "Mẫu gửi": "m1"}
          - {video_id: "v1", time: "2025-03-10", brand: "DHC", creator_name: "a", duration_date: 7, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", "PIC": "An", "Team": "T1", "Vị trí": "top", "Mẫu gửi": "m1"}
          # v2 giống mọi chiều nhưng KHÁC creator_name -> dòng riêng
          - {video_id: "v2", time: "2025-03-10", brand: "DHC", creator_name: "b", duration_date: 7, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", "PIC": "An", "Team": "T1", "Vị trí": "top", "Mẫu gửi": "m1"}
          # v4 cùng creator "a" nhưng KHÁC duration_date -> dòng riêng
          - {video_id: "v4", time: "2025-03-10", brand: "DHC", creator_name: "a", duration_date: 3, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": "2025-03-05", "Phân loại Creator": "S", "Group creator": "S", "PIC": "An", "Team": "T1", "Vị trí": "top", "Mẫu gửi": "m1"}
          # v3 duration_date <= 0 -> bị loại
          - {video_id: "v3", time: "2025-03-10", brand: "DHC", creator_name: "c", duration_date: -1, prod_contain: "kẽm", prod_contain_combo: "kẽm", "Ngày gửi mẫu": null, "Phân loại Creator": "Organic", "Group creator": "Organic", "PIC": null, "Team": null, "Vị trí": null, "Mẫu gửi": null}
    expect:
      rows:
        - {creator_name: "a", duration_date: 3, so_luong_video: 1}
        - {creator_name: "a", duration_date: 7, so_luong_video: 1}
        - {creator_name: "b", duration_date: 7, so_luong_video: 1}

  # ── Nhóm 1: sản phẩm & loại video ──────────────────────────────
  - name: ut_mart_prod_and_loaivideo
    model: mart_data
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-01", product_name: "DHC combo b mix", creator_name: "a"}
          - {video_id: "v2", time: "2025-03-01", product_name: "Togishi kem chống nắng", creator_name: "b"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "b mix", product_contain_combo: "combo b mix + c"}
      - input: ref('int_send_sample')
        rows: []
      - input: ref('int_valid_classification')
        rows: []
      - input: ref('videos_id_agency')
        rows:
          - {video_id: "v2"}
    expect:
      rows:
        - {video_id: "v1", prod_contain: "b mix", prod_contain_combo: "combo b mix + c", "Loại video": "Video thường"}
        - {video_id: "v2", prod_contain: "Kem chống nắng", prod_contain_combo: "Kem chống nắng", "Loại video": "Video AI"}

  # ── Nhóm 2: gửi mẫu & thời gian (run_date cố định 2025-03-20) ───
  - name: ut_mart_duration
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "a"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "An", team: "T1", vi_tri: "top", product_detail: "kẽm", phan_loai_creator_fix: "S"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        # _check_today = 2025-03-20 - 2025-03-10 = 10 <= 30 -> duration_date = 7
        - {video_id: "v1", "Ngày gửi mẫu": "2025-03-05", duration_date: 7, "video_duoctinhPFM": 1, "DK Creator được gửi mẫu": "Có gửi mẫu", "DK Time air video": "Thỏa mãn ĐK thời gian là sau khi gửi mẫu"}

  # ── Nhóm 3: phân loại creator ──────────────────────────────────
  - name: ut_mart_phanloai
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "a"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "An", team: "T1", vi_tri: "top", product_detail: "kẽm", phan_loai_creator_fix: "S"}
          - {koc_kol: "a", prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-06", ngay_ket_thuc: "2099-12-31", pic_rename: "An", team: "T1", vi_tri: "top", product_detail: "kẽm", phan_loai_creator_fix: "L1"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      # priority S=3 < L1=6 -> chọn S; S ∈ whitelist; PFM=1 -> "S"; group không chứa L* -> "S"
      rows:
        - {video_id: "v1", "Phân loại Creator": "S", "Group creator": "S"}

  # ── Nhóm 4: PIC / Team / Vị trí / Mẫu gửi ──────────────────────
  - name: ut_mart_pic_team_vitri_maugui
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "a"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "a", prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "Anh", team: "T1", vi_tri: "top", product_detail: "mẫu A", phan_loai_creator_fix: "S"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        - {video_id: "v1", "PIC": "Anh", "Team": "T1", "Vị trí": "top", "Mẫu gửi": "mẫu A"}

  # ── Nhóm 5: khớp creator KHÔNG phân biệt hoa/thường (như DAX) ───
  # creator_name 'longhousee' (thường) phải khớp koc_kol 'Longhousee' (hoa).
  # Trên code cũ (join phân biệt hoa/thường) test này FAIL: các cột pick = null.
  - name: ut_mart_creator_case_insensitive
    model: mart_data
    overrides:
      macros:
        is_incremental: false
      vars:
        run_date: "2025-03-20"
    given:
      - input: ref('stg_performance_list')
        rows:
          - {video_id: "v1", time: "2025-03-10", product_name: "x", creator_name: "longhousee"}
      - input: ref('stg_product_name_map')
        rows:
          - {video_id: "v1", product_contain: "kẽm", product_contain_combo: null}
      - input: ref('int_send_sample')
        rows:
          - {koc_kol: "Longhousee", prod_contain: "kẽm", sl: 2, ngay_duyet_mau: "2025-03-05", ngay_ket_thuc: "2099-12-31", pic_rename: "Anh", team: "T1", vi_tri: "top", product_detail: "mẫu A", phan_loai_creator_fix: "S"}
      - input: ref('int_valid_classification')
        rows:
          - {phan_loai_creator: "S"}
      - input: ref('videos_id_agency')
        rows: []
    expect:
      rows:
        - {video_id: "v1", "Ngày gửi mẫu": "2025-03-05", "PIC": "Anh", "Team": "T1", "Vị trí": "top", "Mẫu gửi": "mẫu A", "Phân loại Creator": "S"}
