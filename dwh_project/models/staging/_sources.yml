version: 2

# ─────────────────────────────────────────────────────────────
# NGUỒN raw — 5 bảng đã load sang schema raw trên Postgres:
#   4 bảng từ MySQL (tiktok_dashboard) + 1 bảng từ Postgres `krm` (users).
# database/schema đọc động từ vars (dbt_project.yml). Đổi nguồn bằng
# env SRC_* hoặc --vars '{raw_schema: xxx}'.
# ─────────────────────────────────────────────────────────────
sources:
  - name: raw
    database: "{{ var('raw_database', env_var('SRC_DB', 'dwh')) }}"
    schema: "{{ var('raw_schema', env_var('SRC_SCHEMA', 'raw')) }}"
    tables:
      - name: performance_list
        description: "Hiệu suất video TikTok (base của bảng data)."
      - name: send_sample
        description: "MVA_KOC_KOL_send_sample — lịch sử gửi mẫu KOC/KOL."
      - name: product_name_map
        description: "get_product_name_from_video_tiktok — map video_id -> tên SP chuẩn."
      - name: pic_team
        description: "PIC_Team — map tên PIC gốc -> tên đổi + team."
      - name: users
        description: >
          public.users của Postgres `krm` — nhân sự nội bộ (id, username, team).
          Là nguồn GỐC cho danh tính PIC. Chỉ lấy 4 cột; KHÔNG kéo password/email.
