version: 2

# ─────────────────────────────────────────────────────────────
# NGUỒN raw — 4 bảng đã load từ MySQL sang schema raw trên Postgres.
# database/schema đọc động từ vars (dbt_project.yml). Đổi nguồn bằng
# env SRC_* hoặc --vars '{raw_schema: xxx}'.
# ─────────────────────────────────────────────────────────────
sources:
  - name: raw
    database: "{{ var('raw_database') }}"
    schema: "{{ var('raw_schema') }}"
    tables:
      - name: performance_list
        description: "Hiệu suất video TikTok (base của bảng data)."
      - name: send_sample
        description: "MVA_KOC_KOL_send_sample — lịch sử gửi mẫu KOC/KOL."
      - name: product_name_map
        description: "get_product_name_from_video_tiktok — map video_id -> tên SP chuẩn."
      - name: pic_team
        description: "PIC_Team — map tên PIC gốc -> tên đổi + team."
